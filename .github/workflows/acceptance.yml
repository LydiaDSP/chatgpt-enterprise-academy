name: Academy V1.1 Acceptance
on:
  push:
    branches:
      - 'feat/v1.1-*'
  pull_request:
    paths:
      - 'index.html'
      - 'scenario_data.json'
      - 'samples/**'
      - 'tests/**'
      - 'labs/**'
      - 'skills/**'
      - 'examples/**'
      - '.github/workflows/acceptance.yml'
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static content, syntax and dataset checks
        run: node tests/verify.mjs
      - name: Install isolated browser-simulation test dependency
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26
      - name: Browser interaction smoke tests
        run: node tests/browser-smoke.mjs
      - name: Research, Codex and Skill specialized lab checks
        run: node tests/labs-smoke.mjs
      - name: Work and IE IT scenario acceptance
        run: node tests/phase3-smoke.mjs
      - name: Offline IE and IT prototype automation tests
        run: python3 -m unittest discover -s tests -p 'test_role_agent_mvp.py' -v
